{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 48px auto; text-align: center; padding: 40px 24px;">
  <div style="font-size: 56px; font-weight: 800; color: #f59e0b; margin-bottom: 12px; line-height: 1;">403</div>
  <h1 style="font-size: 20px; margin-bottom: 12px;">访问被拒绝</h1>
  <p style="color: #667085; font-size: 14px; margin-bottom: 28px; line-height: 1.6;">
    您没有权限访问该功能，或者请求的 CSRF 安全凭据已过期。请刷新页面后重试或使用具备权限的账号登录。
  </p>
  <div style="display: flex; justify-content: center; gap: 12px;">
    {% if request.user.is_authenticated %}
      <a class="button primary" href="{% url 'dashboard' %}">返回工作台</a>
    {% else %}
      <a class="button primary" href="{% url 'accounts:login' %}">前往登录</a>
    {% endif %}
  </div>
</div>
{% endblock %}
